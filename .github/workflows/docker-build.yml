name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the Docker image'
        required: true
        default: '1.0.0'
        type: string
      image_name:
        description: 'Custom name for the Docker image'
        required: true
        default: 'jenmon'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nimbleworkinc/${{ github.event.inputs.image_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log workflow inputs
        run: |
          echo "=== Workflow Input Parameters ==="
          echo "Image Name: ${{ github.event.inputs.image_name }}"
          echo "Image Tag: ${{ github.event.inputs.image_tag }}"
          echo "Full Image Name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
          echo "==============================="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests (optional)
        run: |
          echo "Running basic syntax check..."
          python -m py_compile main.py
          python -m py_compile src/*.py
          echo "✅ All Python files compiled successfully"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag }}
            type=raw,value=latest,enable=${{ github.event.inputs.image_tag == 'latest' }}
          labels: |
            org.opencontainers.image.title=Jenmon - Jenkins Monitor
            org.opencontainers.image.description=Streamlit-based Pipeline Monitor for Jenkins pipeline monitoring and analytics
            org.opencontainers.image.vendor=NimbleWork Inc
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./builds/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log successful build
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Repository: ${{ env.IMAGE_NAME }}"
          echo "Tag: ${{ github.event.inputs.image_tag }}" 